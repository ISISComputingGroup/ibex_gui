# Restart Server Processes Warning Notices
uk.ac.stfc.isis.ibex.preferences/restart_warning_runctrl = May cause 'temporary' run-control setttings (e.g. set via scripts) to be lost. In addition, data collection may briefly pause or resume during the IOC restart.
uk.ac.stfc.isis.ibex.preferences/restart_warning_blocksvr = Will restart all IOCs and cause interruptions in the connection to all devices. It is best to do this restart when no script is running.
uk.ac.stfc.isis.ibex.preferences/restart_warning_gwblock = Will cause a brief interruption to all blocks. May also cause brief gaps in logged block values. It is best to do this restart when no script is running.
uk.ac.stfc.isis.ibex.preferences/restart_warning_isisdae = Restarting the ISISDAE IOC will cause brief loss of readbacks for all values read or calculated from the data acquisition electronics. Note that this does not restart the isisicp process, nor does it restart the physical data acquisition electronics. Runs will continue even as the ISISDAE IOC is restarted, but it is recommended to do this restart when no script or data acquisition is running.
uk.ac.stfc.isis.ibex.preferences/restart_warning_instetc = Will cause brief disconnections in many 'central' IBEX PVs, including those serving the instrument dashboard. It is best to do this restart while no script is running.
uk.ac.stfc.isis.ibex.preferences/restart_warning_dbsvr = Will briefly interrupt connections to the IBEX MySQL database, for example IOC and PV lists (it will not restart the IOCs).
uk.ac.stfc.isis.ibex.preferences/restart_warning_alarm = Will briefly interrupt connection in the IBEX 'alarms' view. Does not affect the underlying alarm states of individual PVs.
uk.ac.stfc.isis.ibex.preferences/restart_warning_arinst = Will briefly interrupt 'diagnostic' logging (as used by the log plotter), for all PVs.
uk.ac.stfc.isis.ibex.preferences/restart_warning_arblock = Will briefly interrupt block logging (as used by the log plotter), for all PVs.
